<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixel Story — App Design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="android-frame.jsx"></script>
  <script type="text/babel" src="pixel-story-screens.jsx"></script>
  <script type="text/babel" src="pixel-story-icons.jsx"></script>
  <script type="text/babel" src="pixel-story-icons-v2.jsx"></script>
  <script type="text/babel" src="pixel-story-icon-final.jsx"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1a1924; }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1.0); }
      50%       { transform: scale(1.2); }
    }
    @keyframes dotFade {
      0%, 100% { opacity: 0.18; }
      50%       { opacity: 1;    }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    // Phone wrapper — overrides frame bg to match our deep palette
    function Phone({ children }) {
      return (
        <AndroidDevice dark bg="#0b0b16" width={393} height={852}>
          {children}
        </AndroidDevice>
      );
    }

    // Adaptive-icon rounded mask (Android squircle ≈ 22% radius)
    function IconMask({ children }) {
      return (
        <div style={{
          width: 200, height: 200,
          borderRadius: 44,
          overflow: 'hidden',
        }}>{children}</div>
      );
    }

    function App() {
      return (
        <DesignCanvas>

          {/* ── SECTION 0: FINAL ICON ──────────────────────────── */}
          <DCSection
            id="final-icon"
            title="✨ Final Icon — Glowing Lantern"
            subtitle="Chosen direction · Shown at production sizes">

            <DCArtboard id="final-hero" label="512×512 · Master" width={512} height={512}>
              <FinalIconHero />
            </DCArtboard>

            <DCArtboard id="final-adaptive" label="Android Adaptive Mask" width={280} height={280}>
              <FinalIconAdaptive />
            </DCArtboard>

            <DCArtboard id="final-small" label="96×96 Launcher" width={96} height={96}>
              <FinalIconSmall />
            </DCArtboard>

            <DCArtboard id="final-onhome" label="On Pixel Home Screen" width={320} height={460}>
              <FinalIconOnHome />
            </DCArtboard>

          </DCSection>

          {/* ── SECTION 1: APP SCREENS ───────────────────────────── */}
          <DCSection
            id="screens"
            title="App Screens"
            subtitle="Pixel Story Android · Dark Cinematic Experience">

            <DCArtboard id="splash" label="01 · Splash Screen" width={409} height={868}>
              <Phone><SplashScreen /></Phone>
            </DCArtboard>

            <DCArtboard id="gallery" label="02 · Gallery" width={409} height={868}>
              <Phone><GalleryScreen /></Phone>
            </DCArtboard>

            <DCArtboard id="player-load" label="03 · Story Player — Loading" width={409} height={868}>
              <Phone><StoryPlayerScreen mode="loading" /></Phone>
            </DCArtboard>

            <DCArtboard id="player-active" label="04 · Story Player — Active" width={409} height={868}>
              <Phone><StoryPlayerScreen mode="active" /></Phone>
            </DCArtboard>

          </DCSection>

          {/* ── SECTION 2: APP ICONS ─────────────────────────────── */}
          <DCSection
            id="icons"
            title="App Icons"
            subtitle="5 Directions · Pixel Art × Cinematic Dark">

            <DCArtboard id="icon-a" label="A · Classic Glow" width={200} height={200}>
              <IconMask><IconA /></IconMask>
            </DCArtboard>

            <DCArtboard id="icon-b" label="B · Heart & Stars" width={200} height={200}>
              <IconMask><IconB /></IconMask>
            </DCArtboard>

            <DCArtboard id="icon-c" label="C · Love Letter" width={200} height={200}>
              <IconMask><IconC /></IconMask>
            </DCArtboard>

            <DCArtboard id="icon-d" label="D · Twin Hearts" width={200} height={200}>
              <IconMask><IconD /></IconMask>
            </DCArtboard>

            <DCArtboard id="icon-e" label="E · Crown Heart" width={200} height={200}>
              <IconMask><IconE /></IconMask>
            </DCArtboard>

          </DCSection>

          {/* ── SECTION 3: APP ICONS — ROUND 2 (NO HEARTS) ─── */}
          <DCSection
            id="icons-v2"
            title="App Icons — Round 2"
            subtitle="Story themes · No hearts · Pixel art">

            <DCArtboard id="icon-f" label="F · Crescent Moon" width={200} height={200}>
              <IconMask><IconF /></IconMask>
            </DCArtboard>

            <DCArtboard id="icon-g" label="G · CRT Television" width={200} height={200}>
              <IconMask><IconG /></IconMask>
            </DCArtboard>

            <DCArtboard id="icon-h" label="H · Window onto Night" width={200} height={200}>
              <IconMask><IconH /></IconMask>
            </DCArtboard>

            <DCArtboard id="icon-i" label="I · Glowing Lantern" width={200} height={200}>
              <IconMask><IconI /></IconMask>
            </DCArtboard>

            <DCArtboard id="icon-j" label="J · Open Book" width={200} height={200}>
              <IconMask><IconJ /></IconMask>
            </DCArtboard>

          </DCSection>

        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
